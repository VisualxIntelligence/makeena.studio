# Lint, type-check and test every pull request and every push to main.
# Deploys are not done here: Cloudflare Workers Builds builds and deploys from GitHub.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: Unit and e2e tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Playwright's image ships the browsers and their system libraries. Installing them on the
    # runner meant `playwright install-deps` (apt) on every run, which stalled for 13–18 minutes on
    # a slow Ubuntu mirror and hit the job limit (#23, #24). The tag must match the installed
    # @playwright/test; the first step below fails fast if they drift apart.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Playwright matches the container image
        run: |
          installed="$(node -p "require('@playwright/test/package.json').version")"
          if [ "$installed" != "1.64.1" ]; then
            echo "::error::@playwright/test is $installed but the CI image is v1.64.1. Update container.image in .github/workflows/ci.yml (and this check) to v$installed-noble."
            exit 1
          fi
      - run: npm run test:unit
      - run: npm run build
      - run: npm run budget
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Uses the runner's Chrome. Reports stay private: saved as a build artifact, not uploaded.
      - run: npm run lighthouse
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 7
